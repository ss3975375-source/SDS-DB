publish_to: 'none'
version: 1.0.0+30

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in: ^7.2.0
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  go_router: ^16.2.0
  equatable: ^2.0.7
  sqflite: ^2.4.2
  cryptography: ^2.9.0
  connectivity_plus: ^7.3.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
